version: "3.7"

services:
  marketplace:
    image: siswebgm/marketplace:v0.1.1
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SITE_URL=https://app.comprasevendas.com
      - NEXT_PUBLIC_SITE_NAME=Compra e Vendas
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    networks:
      - network_public
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.marketplace.rule=Host(`app.comprasevendas.com`)"
        - "traefik.http.routers.marketplace.entrypoints=websecure"
        - "traefik.http.routers.marketplace.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.marketplace.loadbalancer.server.port=3000"
        - "traefik.http.middlewares.marketplace-security.headers.sslRedirect=true"
        - "traefik.http.middlewares.marketplace-security.headers.stsSeconds=31536000"
        - "traefik.http.middlewares.marketplace-security.headers.forceSTSHeader=true"
        - "traefik.http.routers.marketplace.middlewares=marketplace-security"
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
        monitor: 30s
      restart_policy:
        condition: on-failure
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: '1'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 128M

networks:
  network_public:
    external: true
    name: network_public
