<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/icon-512x512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <base href="/" />
    <meta name="description" content="GBP Político - Sistema de Gestão Política" />
    <style>
      html, body {
        overscroll-behavior-y: none;
        -webkit-overscroll-behavior-y: none;
      }
      /* Splash exibido enquanto o bundle JS carrega — substituído pelo React ao montar.
         Mesmo visual do loading do Layout.tsx */
      #gbp-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: linear-gradient(135deg, #172554 0%, #1e3a8a 50%, #1d4ed8 100%);
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        z-index: 9999;
      }
      #gbp-splash .gbp-wm {
        position: absolute;
        border-radius: 50%;
        object-fit: cover;
        pointer-events: none;
      }
      #gbp-splash .gbp-wm-a { right: -96px; bottom: -96px; width: 384px; height: 384px; opacity: .07; filter: blur(4px); }
      #gbp-splash .gbp-wm-b { left: -128px; top: -128px; width: 448px; height: 448px; opacity: .05; filter: blur(4px); }
      #gbp-splash .gbp-inner {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
        padding: 0 24px;
      }
      #gbp-splash .gbp-logo-wrap { position: relative; }
      #gbp-splash .gbp-ping {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: rgba(34, 211, 238, 0.3);
        animation: gbp-ping 1.5s cubic-bezier(0, 0, 0.2, 1) infinite;
      }
      #gbp-splash .gbp-ring {
        position: absolute;
        inset: -8px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
      #gbp-splash .gbp-logo {
        position: relative;
        width: 80px;
        height: 80px;
        border-radius: 50%;
        object-fit: cover;
        box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.25), 0 25px 50px -12px rgba(23, 37, 84, 0.5);
      }
      #gbp-splash .gbp-brand { text-align: center; }
      #gbp-splash .gbp-name {
        color: #ffffff;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.025em;
      }
      #gbp-splash .gbp-name span { color: #67e8f9; }
      #gbp-splash .gbp-tag {
        margin-top: 6px;
        color: rgba(191, 219, 254, 0.8);
        font-size: 12px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.25em;
      }
      #gbp-splash .gbp-bar {
        width: 192px;
        height: 4px;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.15);
        overflow: hidden;
      }
      #gbp-splash .gbp-bar-fill {
        width: 33.33%;
        height: 100%;
        border-radius: 9999px;
        background: linear-gradient(90deg, transparent, #67e8f9, transparent);
        animation: gbp-slide 1.2s ease-in-out infinite;
      }
      #gbp-splash .gbp-status {
        display: flex;
        align-items: center;
        gap: 6px;
        color: #dbeafe;
        font-size: 14px;
        font-weight: 500;
      }
      #gbp-splash .gbp-dot {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #67e8f9;
        animation: gbp-bounce 1s infinite;
      }
      #gbp-splash .gbp-dot:nth-child(2) { animation-delay: 0.15s; }
      #gbp-splash .gbp-dot:nth-child(3) { animation-delay: 0.3s; }
      @keyframes gbp-ping {
        75%, 100% { transform: scale(2); opacity: 0; }
      }
      @keyframes gbp-slide {
        0% { transform: translateX(-150%); }
        100% { transform: translateX(450%); }
      }
      @keyframes gbp-bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      @media (prefers-reduced-motion: reduce) {
        #gbp-splash .gbp-ping, #gbp-splash .gbp-bar-fill, #gbp-splash .gbp-dot { animation: none; }
      }
    </style>
    <meta name="theme-color" content="#1E40AF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GBP Político" />
    <link rel="apple-touch-icon" href="/icons/icon-512x512.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>GBP Político</title>
  </head>
  <body>
    <div id="root">
      <div id="gbp-splash">
        <img class="gbp-wm gbp-wm-a" src="https://8a9fa808ea18d066080b81b1741b3afc.cdn.bubble.io/f1683656885399x827876060621908000/gbp%20politico.png" alt="" aria-hidden="true" onerror="this.src='/icons/icon-512x512.png'" />
        <img class="gbp-wm gbp-wm-b" src="https://8a9fa808ea18d066080b81b1741b3afc.cdn.bubble.io/f1683656885399x827876060621908000/gbp%20politico.png" alt="" aria-hidden="true" onerror="this.src='/icons/icon-512x512.png'" />
        <div class="gbp-inner">
          <div class="gbp-logo-wrap">
            <span class="gbp-ping"></span>
            <span class="gbp-ring"></span>
            <img class="gbp-logo" src="https://8a9fa808ea18d066080b81b1741b3afc.cdn.bubble.io/f1683656885399x827876060621908000/gbp%20politico.png" alt="GBP Político" onerror="this.src='/icons/icon-512x512.png'" />
          </div>
          <div class="gbp-brand">
            <div class="gbp-name">GBP <span>Político</span></div>
            <div class="gbp-tag">Gestão política inteligente</div>
          </div>
          <div class="gbp-bar"><div class="gbp-bar-fill"></div></div>
          <div class="gbp-status">
            Verificando seu acesso
            <span class="gbp-dot"></span><span class="gbp-dot"></span><span class="gbp-dot"></span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
